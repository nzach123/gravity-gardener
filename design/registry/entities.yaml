# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  # ── GDC Jump Math ────────────────────────────────────────────────────────
  - name: gravity_derivation
    status: active
    source: src/scripts/components/player_gravity_component.gd
    referenced_by:
      - src/scripts/components/player_gravity_component.gd
      - src/scripts/components/player_jump_component.gd
    variables:
      - jump_height
      - jump_distance_to_peak
      - jump_distance_to_land
      - max_speed
    output_range: [0, 10000]
    expression: |
      t_up   = jump_distance_to_peak / max_speed
      t_down = jump_distance_to_land  / max_speed
      gravity_ascent_mag  = (2.0 * jump_height) / (t_up   * t_up)
      gravity_descent_mag = (2.0 * jump_height) / (t_down * t_down)
      ascent_descent_ratio = gravity_ascent_mag / gravity_descent_mag
    notes: "GDC-style jump math. Designer tunes jump_height, jump_distance_to_peak,
      and jump_distance_to_land in pixels. Gravity magnitudes are derived, not
      hand-tuned. Ascent gravity is weaker than descent for a floatier jump arc."
    added: "2026-08-13"
    revised: ""

  - name: jump_velocity_formula
    status: active
    source: src/scripts/components/player_gravity_component.gd
    referenced_by:
      - src/scripts/components/player_gravity_component.gd
      - src/scripts/components/player_jump_component.gd
    variables:
      - jump_height
      - t_up
    output_range: [0, 5000]
    expression: "jump_velocity = (2.0 * jump_height) / t_up"
    notes: "Initial upward velocity applied on jump. Derived from jump_height and
      time-to-peak. Passed from GravityComponent to JumpComponent via
      set_jump_velocity()."
    added: "2026-08-13"
    revised: ""

  # ── Movement ─────────────────────────────────────────────────────────────
  - name: lateral_movement
    status: active
    source: src/scripts/components/player_movement_component.gd
    referenced_by:
      - src/scripts/components/player_movement_component.gd
    variables:
      - vel_side
      - input_axis
      - max_speed
      - accel
      - ground_friction
      - delta
    output_range: [-350, 350]
    expression: |
      target_speed = input_axis * max_speed
      vel_side = move_toward(vel_side, target_speed, accel * delta)
      if input_axis == 0 and is_on_floor:
          vel_side = move_toward(vel_side, 0, ground_friction * delta)
    notes: "Lateral velocity decomposed along right_dir. Ground uses ground_accel
      and ground_friction; air uses air_accel only (no air friction)."
    added: "2026-08-13"
    revised: ""

  # ── Gravity Lerp ─────────────────────────────────────────────────────────
  - name: gravity_smoothing
    status: active
    source: src/scripts/components/player_gravity_component.gd
    referenced_by:
      - src/scripts/components/player_gravity_component.gd
    variables:
      - gravity
      - target_gravity
      - delta
    output_range: [-980, 980]
    expression: |
      gravity.angle = lerp_angle(gravity.angle, target_gravity.angle, rotation_speed * delta)
      gravity.magnitude = move_toward(gravity.magnitude, target_gravity.magnitude, lerp_speed * delta)
    notes: "Smoothly rotates and scales the live gravity vector toward the target
      set by a GravityZone. Prevents instant gravity flips."
    added: "2026-08-13"
    revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
