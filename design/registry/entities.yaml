    status: active
    source: src/scripts/player.gd
    referenced_by:
      - src/scripts/player.gd
      - src/scripts/main.gd
      - src/scripts/plant.gd
      - src/scripts/gravity_zone.gd
      - src/scripts/spike_hazard.gd
      - src/scripts/goal.gd
      - src/scripts/debugger.gd
      - src/scripts/bucket.gd
    class: CharacterBody2D
    max_speed: 350.0
    ground_accel: 4500.0
    ground_friction: 4000.0
    air_accel: 4000.0
    jump_height: 200.0
    jump_distance_to_peak: 128.0
    jump_distance_to_land: 80.0
    min_jump_velocity: 100.0
    coyote_time: 0.12
    jump_buffer_time: 0.15
    wall_jump_h_force: 450.0
    wall_jump_v_force: 800.0
    wall_jump_cooldown: 0.15
    camera_rotation_enabled: true
    player_died: false
    groups:
      - player
    added: "2026-08-13"
    revised: ""

  # ── Gravity Zone ─────────────────────────────────────────────────────────
  - name: gravity_zone
    status: active
    source: src/scripts/gravity_zone.gd
    referenced_by:
      - src/scripts/gravity_zone.gd
      - src/scripts/main.gd
      - src/scripts/components/player_gravity_component.gd
