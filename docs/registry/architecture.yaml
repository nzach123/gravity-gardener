# Architecture Registry — Gravity Gardener
#
# Machine-readable record of binding architectural stances taken by Accepted and
# Proposed ADRs. `/architecture-decision` reads this file as a BLOCKING conflict
# gate before drafting a new ADR.
#
# Rules:
#   - Append only. Never edit or delete an existing entry.
#   - To change a stance, mark the old entry `status: superseded` with
#     `superseded_by: ADR-NNNN` and append the replacement.
#   - `status` is inherited from the owning ADR (proposed | accepted | superseded).
#   - EXCEPTION — transcription errors. An entry that MISSTATES its own ADR is
#     corrected in place and carries a `corrected:` key naming the date and the
#     reason. This is not a supersession: supersession records that the stance
#     CHANGED, and using it here would falsely imply the ADR once said the wrong
#     thing. The append-only rule governs changed stances, not entries that never
#     matched their source. (Convention settled 2026-08-15, applied to
#     frame_ordering_contract and restart_level_chokepoint_guard.)
#
# Created: 2026-08-14 by ADR-0001
# Contributors: ADR-0001, ADR-0002, ADR-0003, ADR-0004, ADR-0005, ADR-0006, ADR-0007,
#   ADR-0008, ADR-0009, ADR-0010, ADR-0011, ADR-0012

version: 1
last_updated: 2026-08-16 (session 23 — ADR-0010/0011/0012 Accepted)

state_ownership:
  - state: world_gravity_vector
    fields:
      - gravity
      - target_gravity
      - up_dir
      - right_dir
      - baseline_ascent_mag
      - ascent_descent_ratio
      - direction_ease_rate
    owner: GravityAuthority
    owner_kind: autoload
    adr: ADR-0001
    status: accepted
    interface: |
      Read via GravityAuthority.gravity / up_dir / right_dir, or by connecting to
      gravity_changed(direction, multiplier). Written ONLY by
      GravityAuthority.set_gravity() / reset_to().
    note: >
      gravity.md R9 — gravity is world state, not player state. Previously owned by
      PlayerGravityComponent; relocated by ADR-0001. No consumer may cache it.

  - state: level_default_gravity
    fields:
      - default_gravity_direction
      - default_gravity_multiplier
    owner: LevelRoot
    owner_kind: scene_export
    adr: ADR-0001
    status: superseded
    superseded_by: ADR-0002
    interface: |
      Authored per level as @export on the level root. Applied via
      GravityAuthority.reset_to() from GameManager.reset_level_state().
    note: >
      Superseded on caller name only — the ownership stance is unchanged.
      ADR-0002 deletes GameManager.reset_level_state(). See the replacement entry.

  - state: level_default_gravity
    fields:
      - default_gravity_direction
      - default_gravity_multiplier
    owner: LevelRoot
    owner_kind: scene_export
    adr: ADR-0002
    supersedes: ADR-0001
    status: accepted
    interface: |
      Authored per level as @export on the level root. Applied via
      GravityAuthority.reset_to() from LevelRoot._ready() (init step 3e).
    note: >
      Exists because an autoload survives reload_current_scene(). Without it a
      restarted level inherits the gravity the player died under. All 8 existing
      levels must add these exports. Restart is a scene reload, which re-runs
      LevelRoot._ready(), so first load and restart share one path.

  - state: level_watering_state
    fields:
      - buckets_total
      - buckets_consumed
      - carrying_bucket
      - goal_unlocked        # derived, read-only
      - level_complete       # declared here; ADR-0005 owns read/write ordering
    owner: LevelState
    owner_kind: refcounted
    constructed_by: LevelRoot
    adr: ADR-0002
    status: accepted
    interface: |
      Constructed in LevelRoot._ready() and injected via bind(). Written only
      through consume_bucket(). goal_unlocked is derived and has no setter.
    note: >
      watering-system.md R6 — no single plant decides the level is over. Plant
      emits pour_completed and holds no level state. Dies with the level root, so
      restart reset is structural (AC8).

  - state: level_oxygen_state
    fields:
      - capacity             # immutable after construction
      - remaining            # monotonically decreasing
      - fraction
      - band
    owner: OxygenState
    owner_kind: refcounted
    constructed_by: LevelRoot
    adr: ADR-0002
    status: accepted
    interface: |
      Constructed in LevelRoot._ready() from the oxygen_capacity export and
      injected via bind(). Mutated only by drain(). No setter exists for
      remaining.
    note: >
      suit-oxygen.md R4/R5 — nothing refills the suit and oxygen never carries
      between levels. Both hold by construction: no setter, and the object dies
      with the level.

  - state: level_completion_latch
    fields:
      - level_complete
    owner: LevelState
    owner_kind: refcounted
    written_by: LevelRoot._on_player_reached_goal
    adr: ADR-0005
    status: accepted
    interface: |
      Read freely. Written ONLY through LevelState.mark_complete(), and only from
      LevelRoot._on_player_reached_goal(). Write-once: there is no un-set, no
      clear and no reset — restart is reconstruction (ADR-0002).
    note: >
      Discharges the "declared here; ADR-0005 owns read/write ordering" note on
      level_watering_state. This is the single piece of state reconciling
      watering-system.md AC13 (death) with suit-oxygen.md AC8 (completion) on the
      frame oxygen reaches zero. goal_unlocked and level_complete are DISTINCT:
      unlocking the airlock is not entering it (watering-system.md §5).

  - state: oxygen_accessibility_drain_rate_multiplier
    fields:
      - drain_rate_multiplier
    owner: OxygenAccessibility
    owner_kind: autoload
    adr: ADR-0008
    status: proposed
    interface: |
      Read via OxygenAccessibility.drain_rate_multiplier. Written ONLY through
      set_drain_rate_multiplier(value), which clamps to [0.5, 1.0].
    note: >
      In-memory only; resets to 1.0 on every launch. Disk persistence is
      deferred to a future settings-screen ADR, which will call
      set_drain_rate_multiplier() on load. Not a Tuning resource — D6.5's
      read-only rule does not apply here because this is user data, not
      design data (ADR-0006 D6.6).

interfaces:
  - name: gravity_changed
    kind: signal
    signature: "gravity_changed(direction: Vector2, multiplier: float)"
    emitter: GravityAuthority
    consumers:
      - PlayerGravityComponent
      - LevelRoot          # camera rotation
      - PhysicsProps       # indirect, via default-space gravity
    adr: ADR-0001
    status: accepted
    note: >
      The single broadcast. Zones must NOT emit directly to consumers, and
      consumers must NOT subscribe to individual zones.

  - name: GravityAuthority.lifecycle
    kind: method_contract
    signature: |
      initialize(baseline_ascent_mag: float, ascent_descent_ratio: float) -> void
      reset_to(direction: Vector2, multiplier: float) -> void
      set_gravity(direction: Vector2, multiplier: float) -> void
    owner: GravityAuthority
    adr: ADR-0001
    status: accepted
    preconditions:
      - "initialize() must be called before any set_gravity() or reset_to()"
      - "multiplier > 0"
      - "direction is non-zero"
    guarantees:
      - "ascent_descent_ratio never changes after initialize()   [gravity.md AC4]"
      - "jump_velocity is never recomputed, incl. bucket carry   [gravity.md R5/R10, AC11]"
      - "a rejected change leaves gravity untouched              [gravity.md R7/AC7]"
      - "no broadcast occurs before initialize(); push_error instead [gravity.md §5]"

  - name: GravityAuthority.prop_registry
    kind: method_contract
    signature: |
      register_prop(prop: RigidBody2D) -> void
      unregister_prop(prop: RigidBody2D) -> void
      ascent_magnitude() -> float
      descent_magnitude() -> float
    owner: GravityAuthority
    adr: ADR-0001
    status: accepted
    preconditions:
      - "unregister_prop() MUST be called from PropBody._exit_tree()"
    guarantees:
      - "every registered prop is woken on every frame the vector changes [physics-props.md R5/AC3, gravity.md AC12]"
    note: >
      unregister_prop is not optional. physics-props.md R7 frees out-of-bounds
      props; without it the wake loop iterates freed instances.

  - name: LevelState.contract
    kind: method_contract
    signature: |
      _init(buckets_total: int) -> void
      consume_bucket() -> void
      signal goal_unlocked_changed(unlocked: bool)
      signal bucket_consumed(consumed: int, total: int)
    owner: LevelState
    adr: ADR-0002
    status: accepted
    preconditions:
      - "buckets_total >= 0, passed at construction, immutable thereafter"
      - "consume_bucket() is called ONLY on a completed pour (watering R3) — never on pickup or early release"
    guarantees:
      - "goal_unlocked flips true exactly at buckets_consumed >= buckets_total, never before [watering AC6]"
      - "buckets_consumed never decreases and never exceeds buckets_total"
      - "no reset() — restart discards the object [watering AC8]"

  - name: OxygenState.contract
    kind: method_contract
    signature: |
      _init(capacity: float, tuning: OxygenTuning) -> void
      drain(delta: float) -> void
      signal threshold_changed(band: Band)
      signal depleted
    owner: OxygenState
    adr: ADR-0002
    status: accepted
    preconditions:
      - "capacity > 0 — construction fails otherwise [suit-oxygen AC7]"
      - "drain() called exactly once per physics frame, unconditionally, in every player state [suit-oxygen R2/AC1]"
    guarantees:
      - "remaining never increases by any path; no setter, no reset [suit-oxygen R4/AC3]"
      - "depleted emits exactly once"
      - "threshold_changed fires at 0.50 / 0.25 / 0.10 and never re-fires an entered band [suit-oxygen AC10]"
      - "drain() contains no state checks, so no caller can create a safe state [suit-oxygen R2]"
    note: >
      depleted is a PURE STATE signal meaning "the tank is empty". It carries no
      policy. OxygenDrain owns the kill decision and the level_complete
      suppression that suit-oxygen.md AC8 requires.

  - name: level_state_injection
    kind: lifecycle_contract
    signature: "bind(...) called by LevelRoot._ready() on every consumer"
    adr: ADR-0002
    status: accepted
    consumers:
      - "Player / PlayerWateringComponent  <- LevelState   (via @export var player)"
      - "Goal                              <- LevelState   (via @export var goal)"
      - "HUD                               <- LevelState + OxygenState (via new @export var hud)"
      - "OxygenDrain                       <- OxygenState  (child of LevelRoot)"
      - "Plant                             <- nothing; pour_completed wired to consume_bucket()"
    preconditions:
      - "Every consumer MUST refuse to operate before bind() and push_error()"
    note: >
      _ready() is bottom-up, so children are ready before LevelRoot constructs the
      state. A consumer therefore cannot read injected state in its own _ready().
      Same guard pattern as GravityAuthority.initialize() in ADR-0001.
      This corrects architecture.md's init-order block, which had HUD binding at
      step 2.

  - name: LevelState.mark_complete
    kind: method_contract
    signature: "mark_complete() -> void"
    owner: LevelState
    adr: ADR-0005
    status: accepted
    preconditions:
      - "called ONLY from LevelRoot._on_player_reached_goal()"
      - "called BEFORE change_level() in that handler — connection order is not a contract"
    guarantees:
      - "idempotent: a second call is a no-op, never an error"
      - "no path anywhere sets level_complete = false [ADR-0002 level_state_reset_method]"
    note: >
      Goal does NOT call this. Goal emits player_reached_goal and writes no level
      state, preserving watering-system.md §6 "behaviour unchanged" and staying
      clear of ADR-0002's plant_decides_level_outcome ban.

  - name: frame_ordering_contract
    kind: lifecycle_contract
    signature: |
      process_physics_priority, assigned in _ready() from FramePriority constants:
        -100  GravityAuthority   ease, space gravity, force-wake props
           0  Player (+ components inline), Plant   pour, movement, move_and_slide()
        +100  OxygenDrain        armed-kill evaluation, then drain
    adr: ADR-0005
    status: accepted
    preconditions:
      - "process_physics_priority, NOT process_priority — the latter orders _process (ADR-0005 F1, verified 2026-08-14)"
      - "assigned in code, never per-scene in the inspector: 8 level scenes = 8 chances to drift"
      - "constants live on a const-only FramePriority script, NOT on LevelRoot (ADR-0005 A5-05): GravityAuthority is an autoload present before any level scene loads and must not source a constant from a per-level scene script — architecture.md:359, no module calls upward"
    corrected: >
      2026-08-15 — signature said "from LevelRoot constants", contradicting the
      ADR-0005 Key Interfaces block that hoisted them off LevelRoot. Corrected in
      place, not superseded: the stance never changed, the entry misstated its own
      ADR. Conflict C4 of architecture-review-2026-08-15.md.
    guarantees:
      - "no consumer can read a stale gravity vector [gravity.md AC12]"
      - "the pour resolves before the drain in every frame [watering AC13]"
    note: >
      Goal has NO row and takes no priority. Area overlap is resolved once per
      physics step, not when a body moves, so no priority value lets Goal observe
      an entry caused earlier in the same batch. It resolves at the physics-query
      phase — a different point in the frame, not a different priority.

  - name: OxygenDrain.frame_contract
    kind: method_contract
    signature: |
      _physics_process(delta):
        if level_complete:      return          # frozen: no drain, no kill
        if _death_armed:        restart_level(); return
        drain(delta)
        if remaining <= 0.0:    _death_armed = true
    owner: OxygenDrain
    adr: ADR-0005
    status: accepted
    preconditions:
      - "the four steps run in exactly this order"
      - "arming and killing NEVER happen in the same callback [suit-oxygen AC8]"
    guarantees:
      - "airlock entry on the depletion frame completes the level [suit-oxygen AC8]"
      - "a final pour on the depletion frame still kills [watering AC13]"
      - "OxygenState.drain() itself keeps NO state checks [ADR-0002, suit-oxygen R2]"
    narrows:
      entry: OxygenState.contract
      adr: ADR-0002
      precondition: "drain() called exactly once per physics frame, unconditionally, in every player state"
      scope: >
        level_complete is the ONLY condition permitted to suppress a drain() call,
        and it is checked in OxygenDrain, never inside OxygenState.drain(). The
        ADR-0002 precondition exists to stop PLAYER STATES (watering, crouching,
        wall-cling) becoming oxygen sanctuaries; level_complete is not a player
        state, it is the level having ended. suit-oxygen R4 is untouched —
        freezing is not refilling and remaining still has no setter.
      note: "Recorded as an explicit narrowing, not a supersession. The ADR-0002 entry is unmodified."

  - name: LevelValidation.contract
    kind: method_contract
    signature: |
      static validate(level: Node) -> PackedStringArray
      static count_buckets(level: Node) -> int
    owner: LevelValidation
    adr: ADR-0003
    status: accepted
    preconditions:
      - "validate() is called from LevelRoot._ready() BEFORE LevelState/OxygenState are constructed [ADR-0003 D3.1]"
      - "the caller push_error()s each returned finding; validate() itself pushes nothing"
      - "LevelRoot seeds buckets_total from count_buckets(), never from an independent count [D3.5]"
    guarantees:
      - "returns ALL contract breaches, never only the first [watering-system.md R8]"
      - "pure: no side effects, no mutation, idempotent across repeated calls"
      - "reads authored @export values and subtree shape ONLY — never LevelState, OxygenState, or bind() output"
      - "callable on a scene instantiated but never added to the SceneTree [ADR-0003 E1/E2]"
      - "finding codes are stable contract; message prose may be reworded freely"
    rules:
      - "V-BUCKET-SUM  count_buckets(level) == sum(plant.buckets_required)  [watering R8/AC7]"
      - "V-PLANT-MIN   every Plant has buckets_required >= 1                [watering R5]"
      - "V-OXY-CAP     oxygen_capacity > 0                                 [suit-oxygen §5/AC7]"
      - "V-GRAV-EXPORT default_gravity_direction non-zero, multiplier > 0   [ADR-0001, delegated]"
      - "V-PROP-BUDGET PropBody count <= PropTuning.props_per_level_budget  [props R8/§7 — BLOCKED on ADR-0006]"
      - "V-WIRING      required consumer NodePath exports resolve           [ADR-0002, delegated]"
    narrows:
      entry: level_state_injection
      adr: ADR-0002
      precondition: "ADR-0002 requested a 'required consumers bound' check"
      scope: >
        V-WIRING checks consumers are WIRED, not BOUND. Validation runs at
        LevelRoot._ready() step (a) and bind() at step (c), so binding has not
        happened and cannot be observed. V-WIRING verifies the exported NodePaths
        are non-empty and resolve — the condition under which step (c) will
        succeed. ADR-0002's per-consumer guard still catches the never-bound case
        at first use. Complementary; neither subsumes the other.
      note: "A narrowing of ADR-0002's request, not a refusal. The ADR-0002 entry is unmodified."

  - name: CollisionLayers.allocation
    kind: constant_table
    signature: |
      const WORLD: int  = 1 << 0   # 1  terrain, AnimatableBody2D platforms
      const PLAYER: int = 1 << 1   # 2  the Player CharacterBody2D, and nothing else
      # bit 3 (value 4) RETIRED — occupied by nothing, do not claim
      const PROP: int   = 1 << 3   # 8  PropBody RigidBody2D
      const ALLOCATED: int = WORLD | PLAYER | PROP   # 11
      const PLAYER_MASK: int   = WORLD               # 1
      const PROP_MASK: int     = WORLD | PROP        # 9
      const DETECTOR_MASK: int = PLAYER              # 2
      const DETECTOR_LAYER: int = 0
    owner: CollisionLayers
    adr: ADR-0004
    status: accepted
    guarantees:
      - "prop.collision_mask & PLAYER == 0 AND player.collision_mask & PROP == 0 [physics-props.md R1/R2, AC1]"
      - "detector areas mask PLAYER only, so props are invisible to them        [physics-props.md AC2]"
      - "no scene claims a bit outside ALLOCATED — (layer|mask) & ~ALLOCATED == 0"
      - "every TileSet.physics_layer_0/collision_layer == WORLD"
    preconditions:
      - "values are AUTHORED in .tscn files; never assigned at runtime (see runtime_collision_mask_mutation)"
    note: >
      Authoritative over project.godot's layer_names, which are editor-facing only;
      on divergence this table is correct and project.godot is the bug. Renamed from
      architecture.md's `CollisionLayerRegistry` (ADR-0004 D4.4) — it registers
      nothing at runtime, it is a constant table. Detectors need NO layer of their
      own: Area2D.body_entered gates on the AREA's mask vs the BODY's layer only
      (godot_area_pair_2d.cpp:36, verified 2026-08-14).

  - name: Tuning.constants
    kind: constant_table
    signature: |
      class_name Tuning
      const WATERING: WateringTuning = preload("res://src/resources/tuning/watering_tuning.tres")
      const OXYGEN:   OxygenTuning   = preload("res://src/resources/tuning/oxygen_tuning.tres")
      const PROP:     PropTuning     = preload("res://src/resources/tuning/prop_tuning.tres")
    owner: Tuning
    adr: ADR-0006
    status: accepted
    guarantees:
      - "exactly one instance per tuning class, project-wide [T3 + D6.9]"
      - "resolves with NO SceneTree involvement at all — script-load time, not tree time [T2]"
      - "zero per-frame allocation and zero file I/O after parse"
      - "a missing or renamed .tres fails at PARSE time, not at first use"
    preconditions:
      - "Tuning is NOT an autoload and must never become one — preload already gives universal reach"
      - "consumers reach tuning ONLY through Tuning; no consumer names a .tres path"
      - "resource_local_to_scene stays false on all three resources (D6.9)"
    consumers:
      - "GravityAuthority  <- Tuning.PROP.prop_gravity_scale       (autoload, per easing frame, ADR-0001 part 4)"
      - "LevelValidation   <- Tuning.PROP.props_per_level_budget   (static, NULL tree, ADR-0003 V-PROP-BUDGET)"
      - "LevelRoot         <- Tuning.OXYGEN                        (OxygenState.new(cap, tuning), ADR-0002)"
      - "PropBody          <- Tuning.PROP.prop_max_speed           (ADR-0011)"
    note: >
      Same const-table pattern as CollisionLayers (ADR-0004), for the same reason:
      one invariant written down once. The decisive constraint was ADR-0003 E1/E2 —
      LevelValidation runs with get_tree() == null, so an autoload holder is
      UNAVAILABLE, not merely inelegant. preload is a DIFFERENT mechanism from
      E1/E2 (which cover @export values surviving instantiate()); the two facts are
      independent and both hold.

  - name: GravityAuthority.apply_camera_relative_axis
    kind: method_contract
    signature: |
      static func apply_camera_relative_axis(
        input_axis: float, right_dir: Vector2, camera_rotation_enabled: bool
      ) -> float
    owner: GravityAuthority
    adr: ADR-0007
    status: accepted
    guarantees:
      - "the sole implementation of camera-relative axis inversion — PlayerMovementComponent and PlayerVisualComponent both call it instead of carrying independent copies [gravity.md TR-gravity-013]"
    note: >
      Static — touches no instance state, callable before GravityAuthority.initialize()
      has run. The one static method on an otherwise all-instance-method autoload
      script; colocated here because right_dir is its only external dependency and
      GravityAuthority already owns it (ADR-0007 D7.4).

  - name: Player.up_direction_sync
    kind: lifecycle_contract
    signature: "Player._physics_process sets up_direction = GravityAuthority.up_dir as its first statement, before any is_on_floor()/is_on_wall()/move_and_slide() call in the same callback"
    owner: Player
    adr: ADR-0007
    status: accepted
    preconditions:
      - "must run before any floor/wall query in the same _physics_process callback"
    guarantees:
      - "CharacterBody2D floor/wall detection is correct at every gravity angle [gravity.md AC10]"
    note: >
      CharacterBody2D.up_direction is a property on Player itself; GravityAuthority
      cannot set it from another node. ADR-0001 relocated up_dir ownership to
      GravityAuthority but left this sync point unassigned — ADR-0007 closes it
      (TD-ADR finding 1, 2026-08-15). Removing this line "as redundant" is the
      likely failure mode: it compiles, it runs, and floor detection silently
      breaks only under rotated gravity.

  - name: OxygenAccessibility.contract
    kind: method_contract
    signature: |
      @export_range(0.5, 1.0, 0.01) var drain_rate_multiplier: float = 1.0
      func set_drain_rate_multiplier(value: float) -> void
    owner: OxygenAccessibility
    adr: ADR-0008
    status: proposed
    guarantees:
      - "drain_rate_multiplier is always in [0.5, 1.0] — set_drain_rate_multiplier() clamps"
      - "read fresh every physics frame by OxygenDrain; never cached or snapshotted"
    note: >
      Composes with Tuning.OXYGEN.drain_rate by multiplication inside OxygenDrain
      (ADR-0006 D6.6's composition question). OxygenState never depends on this
      autoload — see oxygen_state_reads_accessibility_autoload.

  - name: PlayerWateringComponent.contract
    kind: method_contract
    signature: |
      var carrying_bucket: bool
      var is_watering: bool
      var water_progress: float
      func register_candidate(plant: Plant) -> void
      func unregister_candidate(plant: Plant) -> void
      func pickup_bucket(bucket: Bucket) -> void
      func update_pour(delta: float, interact_held: bool) -> void
    owner: PlayerWateringComponent
    adr: ADR-0009
    status: proposed
    preconditions:
      - "update_pour() is called inline from Player._physics_process step 2 (ADR-0007), never independently scheduled"
    guarantees:
      - "is_watering, water_progress, and the locked target are written ONLY inside update_pour()"
      - "carries no process_physics_priority of its own — see watering_component_gains_own_physics_process"
    note: >
      A Node child of Player, same shape as its sibling components (ADR-0007).
      Its script must never override _process or _physics_process.

  - name: Plant.watering_contract
    kind: method_contract
    signature: |
      signal player_entered_range
      signal player_exited_range
      signal pour_completed          # fixed name, ADR-0002
      func is_capped() -> bool
      func receive_pour() -> void
      @export var buckets_required: int
      @export var water_duration: float
    owner: Plant
    adr: ADR-0009
    status: proposed
    guarantees:
      - "receive_pour() is the only path that increments buckets_received"
      - "is_capped() is checked by the caller (PlayerWateringComponent) at target selection — a capped plant is never locked as a target, so water_progress never accumulates against it"
    note: >
      Plant drives no per-frame accumulation of its own. Growth-visual playback
      (speed_scale, play()) stays in _process (ADR-0005 D5.5's cosmetic carve-out).

  - name: frame_ordering_contract.plant_removed
    kind: lifecycle_contract
    signature: "Plant carries no process_physics_priority assignment"
    adr: ADR-0009
    status: proposed
    narrows:
      entry: frame_ordering_contract
      adr: ADR-0005
      precondition: "signature listed 'Player (+ components inline), Plant' sharing priority 0"
      scope: >
        Plant's row in the ADR-0005 diagram existed only because plant.gd still
        drove its own water_progress accumulation at the time ADR-0005 was
        written. ADR-0009 moves pour-driving to PlayerWateringComponent
        (watering_pour_driving_owner), which runs inline within Player's own
        priority-0 callback. Plant has no per-frame rule-bearing work left, so
        it needs no process_physics_priority value at all — not 0, not
        anything else. The ADR-0005 entry is unmodified; this narrows which
        node the "Plant" mention in its signature still applies to.
      note: "See also plant_gains_process_physics_priority (forbidden_patterns)."

  - name: PropBody.contract
    kind: method_contract
    signature: |
      class_name PropBody extends RigidBody2D
      func _ready() -> void       # register_prop(self)
      func _exit_tree() -> void   # unregister_prop(self)
      func _integrate_forces(state: PhysicsDirectBodyState2D) -> void   # speed clamp
    owner: PropBody
    adr: ADR-0011
    status: accepted
    preconditions:
      - "custom_integrator = false, gravity_scale = 1.0 — fixed, never authored per instance"
      - "collision_layer / collision_mask fixed to CollisionLayers.PROP / PROP_MASK — never authored per instance"
    guarantees:
      - "speed never exceeds Tuning.PROP.prop_max_speed, at any gravity angle [physics-props.md AC7]"
      - "_integrate_forces runs only on an active body, so a settled prop costs nothing in steady state"
    note: >
      mass, friction, bounce, linear_damp and angular_damp stay per-scene and
      authored freely (physics-props.md §7, ADR-0006 D6.1).

  - name: LevelRoot.level_bounds
    kind: scene_export
    signature: "@export var level_bounds: Area2D   # collision_layer 0 / mask 8 (prop)"
    owner: LevelRoot
    adr: ADR-0011
    status: accepted
    guarantees:
      - "a PropBody exiting level_bounds is freed via queue_free() within one physics frame [physics-props.md R7/AC9]"
    note: >
      Replaces the KillArea2D option ADR-0004 left open (see
      prop_isolation_by_mask's closure note below) — a plane catches one of four
      gravity directions and six of eight levels have no plane at all.
      level_bounds joins the V-WIRING required-consumer table as Required,
      effective on this ADR's acceptance (ADR-0011 D11.7).

  - name: HUD.contract
    kind: method_contract
    signature: |
      class_name HUD extends Node
      func bind(level_state: LevelState, oxygen_state: OxygenState) -> void
      var is_bound: bool
    owner: HUD
    adr: ADR-0010
    status: accepted
    preconditions:
      - "every read path checks is_bound and push_error()s once before bind() has run"
    guarantees:
      - "no HUD script calls a mutator on OxygenState, LevelState, Plant or PlayerWateringComponent — enforced by test, not structure [hud.md H19]"
    note: >
      Root is a plain Node, NOT a CanvasLayer — see hud_zones_via_sibling_canvaslayers.
      No signal is added to any existing class; the HUD subscribes only to
      signals that already exist.

  - name: PauseController.contract
    kind: method_contract
    signature: |
      class_name PauseController extends Node   # process_mode = PROCESS_MODE_ALWAYS
      func toggle_pause() -> void
      func set_paused(value: bool) -> void
      var is_paused: bool
    owner: PauseController
    adr: ADR-0010
    status: accepted
    guarantees:
      - "get_tree().paused is written ONLY here"
    note: >
      Owns the toggle, not a menu — no pause menu is designed by ADR-0010. Every
      other HUD node stays at the default PROCESS_MODE_INHERIT (resolves to
      PAUSABLE) so it freezes on pause; only PauseController and the debug
      overlay E7 take PROCESS_MODE_ALWAYS.

  - name: Bucket.throw_spent
    kind: method_contract
    signature: "func throw_spent(up_dir: Vector2, right_dir: Vector2) -> void"
    owner: Bucket
    adr: ADR-0012
    status: accepted
    preconditions:
      - "called once, after consume(), from PlayerWateringComponent._complete_pour()"
      - "up_dir / right_dir are captured into locals at the call, before any deferral"
    guarantees:
      - "monitorable is false on the same frame throw_spent() returns, no await needed [D12.4]"
      - "a mid-flight gravity change does not re-aim the arc — the basis was already copied out [watering-system.md §5]"
      - "the jug is freed within throw_duration + 0.1s of pour completion [AC10]"
    note: >
      consume() and update_pour() are unchanged and stay frozen. See
      monitorable_write_window_by_call_site for why this write is synchronous
      where on_picked_up()'s is deferred.

api_decisions:
  - decision: prop_gravity_via_physics_space
    choice: "PhysicsServer2D.area_set_param on the default 2D space (AREA_PARAM_GRAVITY_VECTOR + AREA_PARAM_GRAVITY)"
    rejected:
      - "per-prop apply_central_force each frame"
      - "props subscribing to a re-emitted Player signal"
    adr: ADR-0001
    status: accepted
    rationale: >
      Space gravity is symmetric by nature (physics-props.md R4, zero code) and
      reaches every RigidBody2D in the same physics frame (gravity.md AC12,
      physics-props.md AC4) with no per-prop per-frame cost.
    implementation_notes:
      - "Rewrite both params EVERY physics frame while easing — physics-props.md R3 requires props to follow the rotation, not snap to the target."
      - "Space gravity does NOT wake sleeping bodies; the wake loop is separate and mandatory."
      - "CharacterBody2D ignores space gravity, so the player keeps its asymmetric manual application."
    verify_at_implementation:
      - "exact enum spelling of AREA_PARAM_GRAVITY_VECTOR / AREA_PARAM_GRAVITY (Godot 4.7)"
    extension:
      adr: ADR-0011
      change: >
        reset_to() now performs the same two area_set_param writes SYNCHRONOUSLY,
        in addition to setting gravity and target_gravity (D11.5). The original
        decision wrote both params only while easing (gravity != target_gravity),
        which is false immediately after reset_to() sets them equal — so the
        write never fired on level load or restart, and a Viewport's World2D
        space RID survives reload_current_scene(), so props fell the PREVIOUS
        level's way until the first zone-triggered change. Found by the
        session-18 review; ADR-0001's own V6 asserted the gravity field only and
        would have passed while the defect was live. This is an addition to the
        decision, not a reversal — the per-frame ease-gate write is unchanged.

  - decision: hud_zones_via_sibling_canvaslayers
    choice: "HUD root is a plain Node; its four zones are SIBLING CanvasLayer children (Z1-Z4), never nested"
    rejected:
      - "a CanvasLayer root with the four zones nested inside it — the ADR's own first draft, reverted at engine review"
      - "one CanvasLayer root with the zones as ordinary Control containers ordered by tree order or z_index"
    adr: ADR-0010
    status: accepted
    rationale: >
      A CanvasLayer does not observe the Camera2D transform at all, which is
      the documented mechanism for screen-fixed UI — this is what holds every
      HUD element upright through the camera's 0.6s rotation tween in level_01
      and level_07 (hud.md H1), structurally rather than by per-frame
      counter-rotation arithmetic. Nesting CanvasLayer under CanvasLayer was
      rejected at engine review: it is not the documented arrangement, and
      nested layers have open, unresolved engine issues where the declared
      `layer` order is not honoured (godotengine/godot#25384, #22687) — a
      hazard this ADR cannot accept for a load-bearing ordering requirement.
    implementation_notes:
      - "Ordering is by CanvasLayer.layer, an explicit integer, never by scene-tree position — a tree reorder must not change which zone occludes which."
      - "follow_viewport_enabled stays false (engine default) on all four layers; enabling it would silently break the viewport-pixel projection."

  - decision: hud_tuning_via_scene_exports
    choice: "The HUD's 10 layout knobs are @export vars on hud.gd, edited on the single hud.tscn — no fourth Tuning resource"
    rejected:
      - "a fourth HudTuning resource alongside WateringTuning/OxygenTuning/PropTuning"
    adr: ADR-0010
    status: accepted
    rationale: >
      ADR-0006 D6.1 sized the tuning-resource set at exactly three, one per
      GDD. The HUD is not a GDD. Every HUD knob is a viewport-pixel layout
      measurement or an animation duration, never a gameplay balance value, so
      the coding standard's "gameplay values must be data-driven" rule does not
      reach them. Adding a fourth resource would extend a frozen ADR-0006
      decision to hold values that aren't gameplay data.
    note: "Closes hud.md Q16. Recoverable later by promoting to a resource without changing any call site."

  - decision: world_to_canvas_via_global_transform_with_canvas
    choice: "Z1/Z2 project world position with tracked.get_global_transform_with_canvas().origin, not get_viewport().get_canvas_transform() * tracked.global_position"
    rejected:
      - "the canvas-transform multiply form — algebraically equivalent for a bare position, but unconfirmable under simultaneous camera rotation and non-default zoom at engine review"
    adr: ADR-0010
    status: accepted
    rationale: >
      Both forms are equivalent for a bare position since global_position
      already bakes in every ancestor transform, but get_global_transform_with_canvas()
      is the class-documented API for "where does this CanvasItem sit in canvas
      space right now" and costs nothing extra to prefer. V1/V2 test the result
      empirically under a live camera tween regardless of which form ships.

  - decision: prop_speed_cap_via_integrate_forces
    choice: "PropBody clamps linear_velocity magnitude inside _integrate_forces(state), never in _physics_process"
    rejected:
      - "clamping linear_velocity from an ordinary _physics_process override"
      - "a high linear_damp producing a terminal velocity instead of a hard clamp"
    adr: ADR-0011
    status: accepted
    rationale: >
      _integrate_forces is called only on an active body — confirmed against
      4.7.1-stable engine source at review (godot_step_2d.cpp:140,151;
      godot_body_2d.cpp:139-147) — so a settled prop sleeps and costs zero
      per-frame script cost, satisfying the architecture.yaml prop_gravity
      budget line. Clamping magnitude (not axis-by-axis) keeps the cap
      gravity-angle agnostic with no angle-aware code. linear_damp was
      rejected because it slows the WHOLE fall, not only its top end,
      breaking the props-and-player-fall-together property physics-props.md
      §4 names as what makes a flip read as one event.

  - decision: monitorable_write_window_by_call_site
    choice: "Bucket.throw_spent() sets monitorable = false SYNCHRONOUSLY, unlike on_picked_up()'s set_deferred() write"
    rejected:
      - "deferring the write by analogy with on_picked_up() — the ADR's own first draft, reverted at engine review"
    adr: ADR-0012
    status: accepted
    rationale: >
      on_picked_up() is called from _on_body_entered, which fires during
      PhysicsServer2D::flush_queries() — mutating an Area2D monitor flag there
      raises a runtime error, forcing set_deferred(). throw_spent()'s only call
      path is _complete_pour() -> update_pour() -> Player._physics_process
      step 2, which core.md places strictly AFTER flush_queries() has
      returned — a different physics window, so the synchronous write is
      safe. The first draft deferred it "for the same reason on_picked_up()
      defers", reasoning by analogy instead of tracing the call path; the
      godot-specialist gate caught it. Recorded here so a future reader does
      not re-derive the correction, and so any future Area2D monitor-flag call
      site in this project is checked against its own window rather than an
      adjacent one.
    implementation_notes:
      - "Also closes the one-frame window in which a jug already in flight would still be detectable, and keeps V1/V2 genuine Logic tests — a deferred write needs a live SceneTree iteration to flush, which a headless single-frame test never does."

  - decision: gravity_authority_autoload_kind
    choice: "scene autoload (gravity_authority.tscn with script attached)"
    rejected:
      - "bare script autoload"
    adr: ADR-0001
    status: accepted
    rationale: >
      A bare script autoload gives @export var direction_ease_rate no inspector
      surface, making the export decorative and leaving the value effectively
      hardcoded — the exact defect the export exists to fix.

  - decision: jump_constants_location
    choice: "@export on Player (jump_height, jump_distance_to_peak, jump_distance_to_land)"
    rejected:
      - "GravityTuning .tres resource"
    adr: ADR-0001
    status: accepted
    rationale: >
      USER DECISION on 2026-08-13, made against the standing recommendation and
      reaffirmed 2026-08-14. Keeps designer knobs on the node they already live on.
    consequence: >
      The gravity.md §5 initialisation-order hazard stays LIVE and must not be
      deleted from the GDD. Guarded by GravityAuthority refusing to broadcast
      before initialize().

  - decision: level_state_lifetime
    choice: "LevelRoot constructs and owns LevelState + OxygenState; restart is reconstruction via reload_current_scene()"
    rejected:
      - "GameManager autoload holds both objects and clears them in reset_level_state() (architecture.md D2 as originally written)"
      - "flat untyped fields on GameManager (status quo)"
      - "hybrid — LevelRoot constructs, GameManager publishes for global lookup"
      - "one autoload per state object"
    adr: ADR-0002
    status: accepted
    rationale: >
      USER DECISION 2026-08-14, deviating from architecture.md D2. reset_level_state()
      existed only because an autoload survives reload_current_scene(), and
      restart_level() already reloads the scene. Under LevelRoot ownership the
      reload discards both objects and _ready() builds fresh ones, so watering AC8
      and oxygen AC4/AC5 hold by construction rather than depending on a
      hand-maintained reset function — a function that is ALREADY missing
      carrying_bucket today. Unlike ADR-0001 Alternative 3, no global engine
      resource forces an autoload here.
    consequence: >
      architecture.md D2, its init-order block, its signal table and the
      LevelState/OxygenState API blocks were all amended 2026-08-14. Explicit
      injection wiring is now required and LevelRoot must reach every consumer.

  - decision: oxygen_state_constructor_injection
    choice: "OxygenState._init(capacity, tuning) — capacity validated at construction"
    rejected:
      - "configure(capacity, tuning) called after construction"
    adr: ADR-0002
    status: accepted
    rationale: >
      An OxygenState with non-positive capacity is not constructible, making
      suit-oxygen.md AC7's runtime failure mode unreachable. LevelValidation
      (ADR-0003) still reports it at load time, because authoring feedback needs
      all failures at once rather than the first crash.

  - decision: armed_death_one_frame_deferral
    choice: "OxygenDrain arms on depletion and evaluates the kill at the top of its NEXT physics callback"
    rejected:
      - "same-frame geometric poll in Goal (rect.has_point at +50)"
      - "same-frame physics shape query in Goal (intersect_shape at +50)"
      - "architecture.md D5 as originally written — Goal._physics_process at +50"
    adr: ADR-0005
    status: accepted
    rationale: >
      Area overlap is resolved once per physics step, not when a body moves, so
      NOTHING later in the batch that moved the player can observe the entry.
      Deferring the kill one frame lets body_entered land first. The rejected
      same-frame options each give Goal a second source of truth for "is the
      player in the airlock" that must be kept in sync with its own Area2D
      forever — a permanent liability bought with 16.6 ms of imperceptible
      latency. Deferral also preserves watering-system.md §6 "Goal behaviour
      unchanged".
    implementation_notes:
      - "Robust to the one unresolved phase question: whether body_entered is emitted at the tail of step N or at the query flush opening frame N+1, it lands after frame N's +100 and before frame N+1's. Both readings work; no verification is owed."
      - "The deferral MUST carry a comment citing ADR-0005 and AC8 — collapsing it into a direct kill is an obvious-looking cleanup that silently breaks AC8."
    consequence: >
      One physics frame exists in which remaining <= 0 and the player is alive and
      controllable. No current mechanic can act inside 16.6 ms. Revisit if a
      future mechanic grants meaningful single-frame action, or if a death VFX is
      authored to begin on the depletion frame rather than on the restart.

  - decision: restart_level_chokepoint_guard
    choice: "LevelRoot.restart_level() returns early when level_complete is true OR _transition_pending is set; both the restart path and the completion path check and set _transition_pending"
    rejected:
      - "guarding only OxygenDrain (the literal reading of architecture.md and ADR-0002)"
      - "guarding on level_complete alone — ADR-0005 D5.4 declares this INSUFFICIENT, see below"
    adr: ADR-0005
    status: accepted
    rationale: >
      suit-oxygen.md R3/AC2 requires oxygen, spike and kill-area death to be
      INDISTINGUISHABLE. Guarding only the oxygen path makes oxygen the sole death
      that respects completion, so a spike touched on the completion frame would
      restart a level already won. The chokepoint costs two lines and closes the
      whole class, including death paths added later by an author who never reads
      ADR-0005.
    implementation_notes: >
      The level_complete latch ALONE IS NOT SUFFICIENT (ADR-0005 D5.4, specialist
      finding A5-02). body_entered for DIFFERENT Area2D nodes delivered in the same
      flush_queries() batch is not ordered by process_physics_priority — that property
      governs _physics_process dispatch, not signal-callback dispatch during query
      flush — and no deterministic inter-area delivery order could be established from
      documentation or source. If a hazard trigger and the goal trigger are both
      entered within one physics tick and the hazard handler runs first, restart_level()
      queues a reload while level_complete is still false; the goal handler then latches
      completion and queues a scene change, leaving both pending for the same frame.
      Guarding on level_complete cannot close this, because the handler order is the
      very thing in question. An idempotent _transition_pending latch checked and set by
      BOTH paths closes it regardless of order.
    consequence: >
      OxygenDrain keeps its own level_complete check as deliberate redundancy —
      ADR-0002 assigns it the oxygen kill DECISION; the chokepoint is a backstop
      for every path.
    corrected: >
      2026-08-15 — the entry recorded only the level_complete latch, a guard ADR-0005
      D5.4 explicitly declares insufficient. Corrected in place, not superseded: the
      stance never changed, the entry understated its own ADR. This is the more
      consequential of the two 2026-08-15 registry corrections because the gap it left
      is a race, not a naming error. Conflict C5 of architecture-review-2026-08-15.md.

  - decision: level_validation_before_construction
    choice: "LevelValidation.validate() runs at LevelRoot._ready() step (a), BEFORE LevelState/OxygenState are constructed, reading raw authored scene data"
    rejected:
      - "architecture.md as written — construct state at (a), validate at (b)"
      - "validating against the constructed state objects"
    adr: ADR-0003
    status: accepted
    rationale: >
      ADR-0002's oxygen_state_constructor_injection makes OxygenState
      un-constructible at capacity <= 0. Under architecture.md's published order a
      level breaching V-OXY-CAP therefore FAILS AT CONSTRUCTION BEFORE validate()
      ever runs — the one input validate() exists to describe is the one input on
      which it never executes, and the return-all-failures guarantee dies exactly
      where it was needed. Validating first also makes validate() a pure predicate
      over a Node, testable by handing it a synthetic tree.
    consequence: >
      architecture.md §Frame update path must swap steps (a) and (b) and note that
      validation reads raw scene data. NOT YET AMENDED as of 2026-08-14 — the ADR
      is written but the blueprint still carries the defective order.

  - decision: level_validation_ci_gate
    choice: "A headless GdUnit4 test instantiates all 8 level scenes and asserts validate() returns empty; lands WITH the migration epic"
    rejected:
      - "runtime validation only"
      - "@tool + _get_configuration_warnings() edit-time validation"
      - "per-system self-validation distributed across subsystems"
    adr: ADR-0003
    status: accepted
    rationale: >
      Runtime validation fires only on levels someone plays, and the QQ-03
      migration touches all 8. More decisively: watering-system.md AC7 and
      suit-oxygen.md AC7 are both Logic-typed and therefore BLOCKING under the
      coding standards, and a push_error side-effect is not cleanly assertable —
      the returned PackedStringArray is what makes those two ACs automatable at
      all. Viable because instantiate() populates exports without running _ready()
      (ADR-0003 E1/E2, verified 2026-08-14).
    implementation_notes:
      - "The suite-wide test is RED until the migration epic completes (all 8 levels currently fail V-GRAV-EXPORT and V-OXY-CAP). Coding standards forbid committing a skipped test, so it lands WITH the epic, not before. Per-rule unit tests land immediately."
      - "gdUnit4 treats GDScript warnings as errors at test discovery — a shadowed native method name fails the ENTIRE suite at compile time. Run the headless command locally before calling the test step done."

  - decision: collision_layer_central_allocation
    choice: "project.godot layer_names for editor readability PLUS a `class_name CollisionLayers` const script that is authoritative on divergence"
    rejected:
      - "project.godot layer_names only — nothing testable, no code reference (this is the status quo that produced all five defects)"
      - "assigning layers in _ready() from constants — editor checkboxes would never show runtime truth, and it REQUIRES the mutation D4.6 bans"
    adr: ADR-0004
    status: accepted
    rationale: >
      Bit allocation had no owner. Each node was configured by whoever authored it
      against no written table, which is the "depends on every author remembering
      it" failure architecture.md P2 rejects. Claiming any of bits 5-32 now requires
      amending ADR-0004.
    implementation_notes:
      - "bit 3 ('item') is RETIRED, not merely unused — the name is REMOVED from project.godot so the editor stops offering it."
      - "architecture.md:171 documents bit 3 as live and masked by the player; the blueprint is wrong and the code is right. Corrected by ADR-0004 D4.2."
      - "Enforced by a gdUnit4 scene test, NOT a seventh LevelValidation rule — ADR-0003 D3.3's six-rule set stays frozen."

  - decision: prop_isolation_by_mask
    choice: "PropBody layer 8 / mask 9 (world|prop); Player layer 2 / mask 1; detector Area2Ds layer 0 / mask 2"
    rejected:
      - "conditional guards in handlers (`if body is PropBody: return`) — forbidden by physics-props.md R2 by name"
      - "activating bit 3 and inverting detection so the player queries items"
    adr: ADR-0004
    status: accepted
    rationale: >
      Body-vs-body pairing is an OR, not an AND — godot_body_pair_2d.cpp:256-260
      requires `collide_A || collide_B`, so a ONE-SIDED mask mistake still produces
      contact. The guarantee therefore has to be zero in both directions, and is:
      prop.mask(9)&player.layer(2)=0, player.mask(1)&prop.layer(8)=0,
      area.mask(2)&prop.layer(8)=0. Verified against engine source 2026-08-14.
    implementation_notes:
      - "Area2D is NEVER solid — a RigidBody2D is detected by an area, never blocked by it. So prop/interactable isolation rests on detection filtering alone."
      - "Guards would fire AFTER contact already occurred in the physics step: the prop has pushed the player and the handler only suppresses the reaction."
      - "Whether KillArea2D should also mask prop (mask 10) for physics-props.md R7 is ADR-0011's decision, not this one's."
    closed_by:
      adr: ADR-0011
      answer: "No."
      reason: >
        A kill plane is authored for one gravity direction and this game
        rotates through four, so it catches at most one of the four sides a
        prop can leave through — and six of eight levels have no KillArea2D at
        all. ADR-0011 D11.3 frees out-of-bounds props with a per-level
        LevelBounds Area2D instead (see LevelRoot.level_bounds above), which is
        gravity-agnostic on all four sides. KillArea2D never needs mask bit 8.

  - decision: tuning_per_system_granularity
    choice: "Three separate Resource subclasses — WateringTuning, OxygenTuning, PropTuning — exactly as the three GDDs name them"
    rejected:
      - "a single combined GameTuning resource holding all ten knobs"
    adr: ADR-0006
    status: accepted
    rationale: >
      A combined resource would hand ADR-0008, ADR-0009 and ADR-0011 one shared
      surface, making "which module owns this value" un-answerable by inspection —
      the precise inference architecture.md P5 forbids ("never inferred from where
      the value happens to be read"). Three classes make ownership structural and
      keep ADR-0002's frozen OxygenState._init(capacity, tuning: OxygenTuning)
      honest: OxygenState is statically incapable of reading a watering knob.
    implementation_notes:
      - "Per-instance knobs are NOT in these resources and that is deliberate: buckets_required/water_duration on Plant, oxygen_capacity on the level root, mass/friction/bounce/damping per prop scene. Each GDD §7 assigns them."
      - "Every knob that IS in a tuning resource is a GLOBAL feel constant by the GDDs' own classification. That is why no per-level override mechanism exists — nothing in the design asks for one."

  - decision: tuning_reach_via_preload_const
    choice: "A `class_name Tuning` const holder with three preload()ed constants; the ONLY place a tuning .tres path appears"
    rejected:
      - "@export var tuning: PropTuning on each consumer, authored per scene — cannot work for LevelValidation (static, no node) or GravityAuthority (autoload, pre-level)"
      - "a Tuning autoload — UNAVAILABLE to LevelValidation, whose CI gate never adds the scene to a tree"
      - "ProjectSettings entries — tree-free but untyped, un-inspectable, string-keyed"
      - "a preload() const on each consumer individually — one invariant repeated in N files"
      - "static factory PropTuning.get_default() — load() at call time loses the parse-time failure"
    adr: ADR-0006
    status: accepted
    rationale: >
      Three consumers have INCOMPATIBLE reach: an autoload that exists before any
      level, a static function running with get_tree() == null, and a level root.
      preload resolves at script-load time and never consults the tree, so it is
      the only mechanism all three can share. The autoload option is disqualified
      on the same technical ground as group_based_level_discovery (ADR-0003) —
      unavailable on a required code path, not merely inadvisable.
    implementation_notes:
      - "preload NOT load: a missing or renamed .tres becomes a script parse error at startup rather than a null dereference on the first gravity flip (architecture.md P4)."
      - "No autoload parse-order hazard: class_name registration happens at project load BEFORE autoloads instantiate, and tuning.gd loads on first reference. Verified 2026-08-14 (specialist F5)."
      - "Files: src/scripts/tuning/*.gd and src/resources/tuning/*.tres. Deliberate deviation from ADR-0004's flat collision_layers.gd placement — four related files are a group."
    verify_at_implementation:
      - "T4 — whether @export_range clamps a value loaded from a hand-edited .tres. Documented as inspector-only but NOT executed against the pinned 4.7.1 binary."

  - decision: player_gravity_component_basis_derivation
    choice: "PlayerGravityComponent does NOT derive up_dir/right_dir itself; every consumer, including PlayerGravityComponent, reads GravityAuthority.up_dir/.right_dir directly"
    rejected:
      - "PlayerGravityComponent independently deriving up_dir/right_dir from the broadcast vector, per a literal reading of ADR-0001's Decision prose"
    adr: ADR-0007
    status: accepted
    rationale: >
      ADR-0001's Decision text says PlayerGravityComponent "derives its basis
      (up_dir, right_dir)... from the broadcast vector," which reads as the
      component computing its own copy. ADR-0001's own world_gravity_vector
      registry entry lists up_dir/right_dir as GravityAuthority-owned fields with
      "no consumer may cache it." The two cannot both hold. ADR-0007 resolves the
      ambiguity in favor of the registry entry, not the prose — a component that
      recomputes an already-broadcast basis is either a redundant duplicate or, if
      it could ever disagree, a private_gravity_copy violation by another name.
    consequence: >
      This is a stated resolution of an ADR-0001 internal inconsistency, not a
      supersession of ADR-0001's actual decision. See ADR-0007 D7.2's override note.

  - decision: oxygen_drain_rate_accessibility_composition
    choice: >
      OxygenDrain pre-scales delta by OxygenAccessibility.drain_rate_multiplier
      before calling OxygenState.drain(scaled_delta). OxygenState is unchanged
      and still multiplies by tuning.drain_rate internally, so the two compose
      by multiplication with no branch: effective rate = tuning.drain_rate *
      drain_rate_multiplier.
    rejected:
      - "replace model — override fully replaces tuning.drain_rate instead of stacking"
      - "OxygenState reading OxygenAccessibility directly"
      - "designing full ConfigFile/user:// disk persistence now, with no settings UI to write it"
    adr: ADR-0008
    status: proposed
    rationale: >
      USER DECISION 2026-08-15. Stacking via delta pre-scaling keeps
      OxygenState._init(capacity, tuning) and drain(delta) exactly as ADR-0002
      froze them, keeps OxygenState a plain RefCounted with no autoload
      dependency, and needs no "is an override active" branch inside a frame
      contract ADR-0005 already defined as branch-free. Since
      Tuning.OXYGEN.drain_rate is fixed at 1.0 (suit-oxygen.md §7 — "must not
      be used as a difficulty dial"), this reaches the same numbers a replace
      model would, without the branch.
    consequence: >
      drain() receives an accessibility-scaled delta, not a raw frame delta.
      Any future extension of OxygenState.drain() that needs real elapsed
      time (a play-time counter, a VFX timer) must not reuse this value —
      flagged as a risk in ADR-0008.

  - decision: watering_pour_driving_owner
    choice: >
      PlayerWateringComponent owns water_progress, the interact/target-plant
      check, and completion/early-release logic, per watering-system.md §6's
      Code table. Plant reports a completed pour and nothing more.
    rejected:
      - "keeping pour-driving on Plant, per ADR-0005's literal D5.5 text (written against the pre-refactor code, before the GDD's §6 Code table existed)"
    adr: ADR-0009
    status: proposed
    rationale: >
      USER DECISION 2026-08-15. The approved watering-system.md §6 Code table
      already assigns pour-driving to PlayerWateringComponent by name;
      ADR-0005's D5.5 text pre-dates that assignment and names plant.gd only
      because that was still the code's shape at the time. Following D5.5's
      literal text instead would contradict an already-approved GDD and
      require reopening it — a design-document change, outside this ADR's
      authority to make unilaterally.
    consequence: >
      ADR-0005's frame_ordering_contract gains a narrowing note
      (frame_ordering_contract.plant_removed) rather than being silently
      contradicted.

  - decision: watering_target_candidate_registration
    choice: >
      LevelRoot wires each Plant's player_entered_range/player_exited_range
      signals to PlayerWateringComponent.register_candidate()/
      unregister_candidate(), maintaining an Array[Plant] the component scans
      for the nearest uncapped candidate.
    rejected:
      - "PlayerWateringComponent polling get_overlapping_bodies() on every Plant's interact area, every physics frame, via a group lookup"
      - "Bucket pickup mediated by LevelRoot the same way, with a picked_up signal"
    adr: ADR-0009
    status: proposed
    rationale: >
      Group-based per-frame discovery is the same hazard class ADR-0003
      already rejected for LevelValidation (group_based_level_discovery) —
      invisible bookkeeping that silently drops a plant an author forgot to
      register. An explicit LevelRoot-wired connection, matching the existing
      Plant.pour_completed wiring pattern, keeps it visible and testable.
      Bucket pickup is a two-party interaction reaching only the Player node
      Bucket already detected via body_entered — no shared state object is
      involved, so LevelRoot mediation buys nothing there (unlike
      pour_completed, which must reach LevelState).

performance_budgets:
  - system: prop_gravity
    budget: "0 per-frame script cost in steady state; <=40-prop wake pass only while the vector is easing (~6-7 frames per change at 60 FPS)"
    adr: ADR-0001
    status: accepted
    verified_by: "physics-props.md AC10 — a room of props at budget holds 60 FPS during a gravity flip (owned by ADR-0011)"

forbidden_patterns:
  - pattern: area2d_gravity_space_override
    description: "Setting gravity_space_override (or `gravity`) on any Area2D, including GravityZone"
    adr: ADR-0001
    status: accepted
    reason: >
      Gives props PER-REGION gravity from the physics server, contradicting
      gravity.md R2/R9 ("no per-body or per-region gravity") and breaking AC12.
      Presents as props behaving correctly only inside a zone's bounds.
    remediation: "Removed from gravity_zone.tscn (was gravity_space_override = 3, gravity = -980.0)"

  - pattern: per_prop_gravity_application
    description: "apply_central_force for gravity, or per-prop gravity_scale tuning"
    adr: ADR-0001
    status: accepted
    reason: "40 script callbacks + 40 force applications per frame to buy variation physics-props.md R4/§7 explicitly forbids. Use default-space gravity."

  - pattern: private_gravity_copy
    description: "Any node caching its own gravity/target_gravity instead of reading GravityAuthority"
    adr: ADR-0001
    status: accepted
    reason: "Defeats gravity.md R9. There must be exactly one vector; a cached copy can silently diverge."

  - pattern: recompute_jump_velocity
    description: "Recalculating jump_velocity after initialize() — including any bucket-carry weight penalty"
    adr: ADR-0001
    status: accepted
    reason: >
      gravity.md R5/R10 and watering-system.md R2/AC1. Fixed launch velocity is
      what lets level design prove a gap is crossable from the zone multiplier
      alone. Confirmed by the user on 2026-08-14: carrying penalises max_speed ONLY.

  - pattern: broadcast_before_initialize
    description: "Calling set_gravity() or reset_to() before GravityAuthority.initialize()"
    adr: ADR-0001
    status: accepted
    reason: "ascent_descent_ratio is still 1.0, so the asymmetry is silently lost. gravity.md §5. Must push_error and refuse, never broadcast."

  - pattern: zone_targets_player_directly
    description: "Connecting GravityZone.gravity_changed to the player, or calling Player.set_gravity()"
    adr: ADR-0001
    status: accepted
    reason: "Player.set_gravity() is removed by ADR-0001. Zones report to GravityAuthority; the player is a subscriber like any other consumer."

  - pattern: global_level_state_access
    description: "Reaching level or oxygen state through an autoload (GameManager.level_state, a new singleton, or a service locator)"
    adr: ADR-0002
    status: accepted
    reason: >
      Level state is owned by LevelRoot and injected. A global access path
      reintroduces the singleton the coding standard exists to remove, and creates
      a second source of truth for object lifetime — a stale reference to a freed
      level is a failure mode the injected design cannot have.

  - pattern: level_state_reset_method
    description: "Adding reset() to LevelState or OxygenState, or reintroducing GameManager.reset_level_state()"
    adr: ADR-0002
    status: accepted
    reason: >
      Restart is reconstruction: reload_current_scene() discards LevelRoot and
      both state objects. A reset() re-creates the hand-maintained-clear problem
      that already lost carrying_bucket (watering-system.md §5) and turns
      watering AC8 / oxygen AC4 back into conventions.

  - pattern: depleted_wired_to_restart
    description: "Connecting OxygenState.depleted directly to LevelRoot.restart_level()"
    adr: ADR-0002
    status: accepted
    reason: >
      Breaks suit-oxygen.md AC8 — airlock entry on the frame oxygen reaches zero
      must complete the level, not kill. depleted is a pure state signal;
      OxygenDrain owns the policy and the level_complete suppression. Note that
      architecture.md's signal table originally specified the broken wiring; it
      was corrected 2026-08-14.

  - pattern: state_access_before_bind
    description: "A consumer reading LevelState or OxygenState in its own _ready(), or before bind() is called"
    adr: ADR-0002
    status: accepted
    reason: >
      _ready() is bottom-up, so children run before LevelRoot constructs the
      state. Every consumer must guard and push_error(). Same class of hazard as
      broadcast_before_initialize in ADR-0001.

  - pattern: plant_decides_level_outcome
    description: "Plant (or any single objective) writing level-wide state or deciding the level is complete"
    adr: ADR-0002
    status: accepted
    reason: >
      watering-system.md R6 — "no single plant should be deciding whether the room
      is breathable." Plant emits pour_completed and holds no level state.
      Replaces the current plant.gd:73-79 GameManager write.

  - pattern: physics_order_via_process_priority
    description: "Using process_priority to order _physics_process callbacks"
    adr: ADR-0005
    status: accepted
    reason: >
      process_priority orders _process (the idle/render callback);
      _physics_process is ordered by the SEPARATE process_physics_priority.
      Verified against the live Godot 4.7 Node class reference on 2026-08-14
      (ADR-0005 F1). architecture.md named the wrong property until ADR-0005
      corrected it. Failure mode is silent: it compiles, it runs, and tick order
      quietly remains an accident of tree layout — the exact defect D5 exists to
      prevent.

  - pattern: same_frame_oxygen_kill
    description: "Restarting the level in the same _physics_process callback that observed remaining <= 0"
    adr: ADR-0005
    status: accepted
    reason: >
      Breaks suit-oxygen.md AC8. Area overlap is resolved once per physics step,
      not when a body moves, so the player's entry into the airlock cannot be
      observed in the batch that moved them there. Killing immediately kills a
      player who physically reached the door. Presents as AC8 failing ONLY on a
      frame-perfect entry — rare in play and easy to dismiss as a fluke.
      Collapsing the deferral looks like a harmless simplification; it is not.

  - pattern: level_complete_written_outside_level_root
    description: "Any node other than LevelRoot._on_player_reached_goal() setting level_complete, or setting it to false anywhere"
    adr: ADR-0005
    status: accepted
    reason: >
      The latch is write-once with a single writer. Goal is the tempting culprit —
      it is the node that knows the player arrived — but Goal writing level state
      is the same class of defect as ADR-0002's plant_decides_level_outcome, and
      it would spend watering-system.md §6's "behaviour unchanged". A clearable
      latch reintroduces the hand-maintained-reset problem ADR-0002 removed.

  - pattern: unguarded_restart_path
    description: "A death or reset path that reloads the level without consulting level_complete"
    adr: ADR-0005
    status: accepted
    reason: >
      suit-oxygen.md R3/AC2 — the three death paths (oxygen, spike_hazard
      inc_hazard_dmg, kill area) must be indistinguishable. All must route through
      the guarded LevelRoot.restart_level(). A path that reloads directly restarts
      a level the player has already completed, and does so inconsistently with
      the others.

  - pattern: gameplay_timing_in_idle_process
    description: "Accumulating or evaluating rule-bearing quantities in _process — pour progress, oxygen, timers whose value on a specific frame decides an outcome"
    adr: ADR-0005
    status: accepted
    reason: >
      plant.gd advanced water_progress in _process while oxygen drains in
      _physics_process. "The same frame" in watering-system.md AC13 is not a
      defined concept across two clocks running at unrelated rates, so AC13 could
      not be written as a deterministic test at all. Cosmetic work — camera
      follow, sprite placement, animation — legitimately stays in _process. The
      line is whether a RULE reads the value.
    remediation: "plant.gd moves interact polling, water_progress accumulation, the water_duration completion check and the _complete_watering()/_reset_watering() calls to _physics_process (ADR-0005 D5.5); only speed_scale and play() stay in _process. Lands with ADR-0002's removal of the plant.gd:76-79 GameManager write. Moving the accumulation alone is insufficient — see engine specialist review A5-04."

  - pattern: process_thread_group_split_in_frame_chain
    description: "Setting process_thread_group away from the default on GravityAuthority, Player or OxygenDrain"
    adr: ADR-0005
    status: accepted
    source: engine specialist review 2026-08-14 (A5-01)
    reason: >
      The -100 / 0 / +100 ordering contract depends on all three nodes sharing the
      single default_process_group, where physics-processing nodes are held in one
      flat vector sorted by a global priority comparator (ADR-0005 F3, verified
      2026-08-14). process_thread_group (SUB_THREAD / MAIN_THREAD) moves a node and
      its subtree into a separately-scheduled group with an independent priority
      sort. Nothing sets it today. A future author enabling multithreaded processing
      — plausibly while chasing a performance win — would silently detach that node
      from the contract: no compile error, no symptom, until a frame-perfect
      suit-oxygen.md AC8 or watering-system.md AC13 case fails. Same silent-failure
      shape as physics_order_via_process_priority.

  - pattern: validation_first_failure_return
    description: "LevelValidation.validate() returning early on the first breach instead of collecting all of them"
    adr: ADR-0003
    status: accepted
    reason: >
      watering-system.md R8 is explicit that a silently unwinnable level is the
      dangerous failure mode, and a level can breach the bucket contract and the
      oxygen contract simultaneously. Returning one at a time costs a full run per
      defect. Reads like an efficiency win and destroys the requirement the
      function exists to serve.
    remediation: "The recursion must carry a comment citing watering-system.md R8 and ADR-0003, in the same spirit as ADR-0005's deferral comment."

  - pattern: group_based_level_discovery
    description: "Discovering plants, buckets or props via get_nodes_in_group() inside LevelValidation"
    adr: ADR-0003
    status: accepted
    reason: >
      Two independent reasons. (1) TECHNICAL: get_nodes_in_group() is a SceneTree
      method. ADR-0003 D3.7's CI test instantiates each level and never adds it to
      a tree, so get_tree() is null and group lookup is UNAVAILABLE on the code
      path this ADR requires — not merely inadvisable. (2) AUTHORING: group
      membership is invisible bookkeeping with no other consequence, so a node an
      author forgot to add is invisible to validation and the level reports clean.
      That is the exact failure architecture.md P4 exists to close, reintroduced
      inside the mechanism meant to close it.
    note: >
      Narrows ADR-0002's parenthetical "seed from the bucket group count". The
      QUANTITY ADR-0002 defines is unchanged — buckets_total is still the count of
      buckets present at level load (watering-system.md R6) — only the mechanism
      for counting them changes. The ADR-0002 entry is unmodified.

  - pattern: find_children_owned_default
    description: "Using Node.find_children() with the default owned=true for LevelValidation's node discovery"
    adr: ADR-0003
    status: accepted
    source: engine specialist review 2026-08-14 (F3)
    reason: >
      find_children()'s `owned` parameter defaults to TRUE — "only descendants with
      a valid owner node are checked" — so it can silently drop nodes and
      reintroduce the same silent-miss failure class this ADR rejects
      group_based_level_discovery for, by a different route. The hazard is that it
      arrives disguised as a cleanup: the built-in does the same type matching the
      hand-rolled recursion does, so substituting it looks like removing
      boilerplate. Plain get_children() recursion applies NO owner filtering and
      descends into instantiated sub-scenes correctly regardless of `editable path`.
    remediation: "Keep the hand-rolled get_children() recursion. If find_children() is ever used here it must pass owned = false explicitly."

  - pattern: runtime_collision_mask_mutation
    description: "Calling set_collision_layer_value() / set_collision_mask_value(), or assigning collision_layer / collision_mask, at runtime on any gameplay node"
    adr: ADR-0004
    status: accepted
    source: engine specialist review 2026-08-14 (F8)
    reason: >
      ADR-0004's isolation guarantee covers AUTHORED state only, and the scene test
      that verifies it reads .tscn files. A single runtime mutation would break
      physics-props.md R1 invisibly to every check in the project. Recorded plainly:
      this is the WEAKEST link in the ADR-0004 chain — it is enforced by review and
      grep rather than by structure, which is the very property ADR-0004 criticises
      elsewhere. It also forecloses a legitimate Godot technique (one-way platforms,
      temporary invulnerability, phasing); any such feature must revise ADR-0004
      rather than just implement.
    remediation: "Layers are authored data. A CI grep step asserting no file outside collision_layers.gd matches these calls would make the ban structural; recommended and left to the epic."

  - pattern: prop_isolation_by_conditional_guard
    description: "Enforcing prop isolation with type checks in handlers — `if body is PropBody: return` — instead of layer/mask configuration"
    adr: ADR-0004
    status: accepted
    reason: >
      physics-props.md R2 forbids it by name: "enforced by collision layer and mask,
      NOT by conditional logic". Beyond the GDD instruction, it does not work: by the
      time a handler runs, the contact has already been resolved in the physics step,
      so the prop has already pushed the player and the guard only suppresses the
      reaction. It also re-imposes the burden on every future detector author.
    remediation: "Configure the mask. If a prop can reach a handler at all, the layer setup is the bug (physics-props.md R2)."

  - pattern: unallocated_collision_bit
    description: "Using 2D physics bit 3, or any of bits 5-32, on any node or TileSet"
    adr: ADR-0004
    status: accepted
    reason: >
      Only WORLD(1), PLAYER(2) and PROP(8) are allocated. Bit 3 was named "item" but
      occupied by nothing — a named-but-free bit is an invitation for the next author
      needing "an item layer" to find one apparently ready and wire half a system to
      it. Silent claims on bits 5-32 reintroduce the no-owner condition ADR-0004 exists
      to end.
    remediation: "The scene test asserts (layer|mask) & ~CollisionLayers.ALLOCATED == 0, which fails on any unallocated bit. Claiming a new bit requires amending ADR-0004 and adding it to ALLOCATED."

  - pattern: tuning_resource_runtime_mutation
    description: "Assigning to any property of Tuning.WATERING / Tuning.OXYGEN / Tuning.PROP, or calling .duplicate() on a tuning resource to obtain a mutable copy"
    adr: ADR-0006
    status: accepted
    reason: >
      Godot caches resources BY PATH, so every preload of the same .tres yields the
      same object (T3, verified 2026-08-14). A single runtime assignment therefore
      (1) changes the value for every consumer at once, including consumers in other
      systems that never asked; (2) SURVIVES level transitions, because the cache
      outlives reload_current_scene() — the same autoload-shaped hazard ADR-0001
      part 6 had to close for gravity, arriving through a different door; and (3) can
      be written back to DISK if it happens in the editor or a tool script, silently
      editing the authored source of truth in version control.
      Recorded plainly: like ADR-0004's runtime_collision_mask_mutation, this is
      enforced by review and grep rather than by structure. GDScript has no readonly
      resource.
    remediation: "A CI grep asserting no file assigns to a Tuning.* property and none calls .duplicate() on one would make the ban structural; recommended as V7 and left to the epic. The most likely violator is an accessibility settings menu writing drain_rate — see ADR-0006 D6.6, which assigns that composition to ADR-0008 and does NOT relax this ban."

  - pattern: tuning_resource_local_to_scene
    description: "Setting resource_local_to_scene = true on watering_tuning.tres, oxygen_tuning.tres or prop_tuning.tres"
    adr: ADR-0006
    status: accepted
    source: engine specialist review 2026-08-14 (F4)
    reason: >
      The flag makes the engine hand EACH instantiating scene its own copy. On a
      tuning resource it silently destroys the guarantee the whole ADR is built on:
      T3's cache identity stops holding, "exactly one instance project-wide" quietly
      becomes false, and D6.5's read-only reasoning — which rests on there being a
      single shared object — no longer describes reality. Nothing errors. Nothing
      logs. It is a legitimate engine feature (independent materials per instance),
      it is one inspector checkbox, and it is inert today — the same hazard shape as
      ADR-0005's process_thread_group_split_in_frame_chain.
    remediation: "Stated explicitly in ADR-0006 D6.9 rather than left as an assumed default, and asserted by V9. Defaults are what get changed by an author exploring the inspector."

  - pattern: gravity_tuning_resource
    description: "Creating a GravityTuning resource, or relocating jump_height / jump_distance_to_peak / jump_distance_to_land off Player into a .tres"
    adr: ADR-0006
    status: accepted
    reason: >
      ADR-0001 decision part 7 keeps the jump constants as @exports on Player. That
      was a USER DECISION made against the standing recommendation on 2026-08-13 and
      reaffirmed 2026-08-14, and the documented price is that gravity.md §5's
      "initialisation order is load-bearing" edge case STAYS LIVE in the GDD.
      Restated here as a forbidden pattern because ADR-0006 is the document a future
      author reads when asking "where do tuning values live?", and its general rule
      would otherwise imply the jump constants belong in a resource too. Creating
      GravityTuning would silently overturn a decision made twice and reverse a
      documented trade-off.
    remediation: "Changing this requires SUPERSEDING ADR-0001's jump_constants_location, not extending ADR-0006. V8 recommends a CI grep asserting no GravityTuning class or gravity_tuning.tres exists."

  - pattern: tuning_path_literal_outside_holder
    description: "Any file outside src/scripts/tuning/ containing a res://src/resources/tuning/ path literal, via preload() or load()"
    adr: ADR-0006
    status: accepted
    reason: >
      The .tres path is written down exactly once, in tuning.gd. Repeating it in
      each consumer is the same defect as ADR-0004's defect 5 — terrain's collision
      layer configured in five independent places — reached from the other
      direction: one invariant with N copies and no owner. Moving or renaming a
      resource would become a multi-file edit with no compiler help until each file
      is parsed.
    remediation: "V6 recommends a CI grep. NOTE: V6 is recommended-not-asserted, so this stance currently has NO automated backing — it is enforced by review alone until the epic lands the grep."

  - pattern: watering_lockout_skips_visuals
    description: "Player._physics_process returning early from the watering-lockout branch before visual_component.update() runs, instead of gating only steps 3-7"
    adr: ADR-0007
    status: accepted
    reason: >
      watering-system.md AC9 requires the sprite to keep rotating with the gravity
      easing throughout a pour lock and unlock cleanly into the new orientation.
      An early return that skips visual_component.update() freezes the sprite
      mid-pour and makes it snap on unlock. Presents as correct in any manual test
      that doesn't hold a gravity flip open during a pour — an easy case to miss,
      since most pours happen in an already-settled room.
    remediation: "visual_component.update() must run unconditionally every physics frame, watering or not (ADR-0007 D7.3 step 8)."

  - pattern: oxygen_state_reads_accessibility_autoload
    description: "OxygenState, or any RefCounted state object, reading OxygenAccessibility or any other autoload directly instead of receiving a value from its Node caller"
    adr: ADR-0008
    status: proposed
    reason: >
      Breaks the coding standard's "public methods must be unit-testable...
      dependency injection over singletons". OxygenState is constructible and
      testable with only (capacity, tuning) per ADR-0002; an autoload
      dependency would force a live singleton into every test, the same
      hazard class the LevelValidation null-tree precedent (ADR-0003 E1/E2)
      already treats as a risk.
    remediation: "OxygenDrain (a Node) reads OxygenAccessibility.drain_rate_multiplier and pre-scales delta before calling OxygenState.drain() — see oxygen_drain_rate_accessibility_composition."

  - pattern: oxygen_pause_state_object
    description: "Injecting a PauseState object into OxygenDrain or OxygenState, or adding any explicit pause check inside their logic, instead of relying on SceneTree.paused + PROCESS_MODE_INHERIT"
    adr: ADR-0008
    status: proposed
    reason: >
      SceneTree.paused already stops _physics_process from being called at
      all under the default PROCESS_MODE_INHERIT. An injected flag would
      duplicate that engine guarantee for no benefit and add a state check to
      a frame contract ADR-0005 defined as check-then-drain-then-arm with no
      other branches. Already decided against in session 18.
    note: >
      Correctness here is chain-wide: LevelRoot and every ancestor between it
      and the tree root must stay PROCESS_MODE_INHERIT (or explicit
      PAUSABLE). Nothing enforces this structurally — see ADR-0008 Risks.

  - pattern: plant_gains_process_physics_priority
    description: "Assigning process_physics_priority to Plant, at any value"
    adr: ADR-0009
    status: proposed
    reason: >
      Plant has no per-frame rule-bearing work once pour-driving lives on
      PlayerWateringComponent (watering_pour_driving_owner). A future author
      "restoring" a priority-0 assignment "for consistency" with
      GravityAuthority/Player/OxygenDrain would be reintroducing a slot for
      logic that no longer exists on this node. Growth-visual playback
      (speed_scale, play()) is cosmetic and belongs in _process, per ADR-0005
      D5.5's own carve-out.
    remediation: "Plant needs no process_physics_priority assignment at all. If a future feature genuinely needs one, it requires its own ADR, not a silent restoration of ADR-0005's original diagram."

  - pattern: watering_component_gains_own_physics_process
    description: "Adding a _physics_process (or _process) override to PlayerWateringComponent's script"
    adr: ADR-0009
    status: proposed
    source: engine specialist review 2026-08-15
    reason: >
      PlayerWateringComponent is a Node child of Player, the same shape as
      its sibling components, but its update_pour() is meant to run only via
      Player's inline call at step 2. Godot auto-detects a _physics_process
      override on any Node and schedules it independently the moment one
      exists — no opt-in required. A future author copy-pasting boilerplate
      from a sibling component would cause update_pour() to run twice per
      physics frame: once via the phantom auto-call, once via Player's
      existing inline call. No compile error, no crash — water_progress
      silently accumulates twice as fast, halving the effective
      water_duration. Same silent-failure shape as ADR-0005's
      process_thread_group_split_in_frame_chain.
    remediation: "PlayerWateringComponent's script must never define _process or _physics_process. update_pour() is called explicitly, only from Player._physics_process step 2."

  - pattern: runtime_prop_instantiation
    description: "Spawning, pooling, respawning, or persisting any PropBody at runtime — props are authored scene children only"
    adr: ADR-0011
    status: accepted
    reason: >
      physics-props.md R6/AC8 needs every prop back at its authored transform
      after a restart. ADR-0002's reconstruction restart (reload_current_scene())
      already delivers this for free, because the nodes holding authored
      transforms are new after a reload — but only if every prop IS an authored
      scene child with nothing to reconstruct at runtime. A runtime-spawned prop
      has no authored transform to return to, turning R6 from a property of
      object lifetime back into a reset function someone has to maintain — the
      exact failure ADR-0002 exists to remove.
    remediation: "A future feature wanting a breakable crate spawning debris, or a prop dropped by an event, needs a new ADR decision first."

  - pattern: hud_zone_via_nested_canvaslayer
    description: "Nesting a CanvasLayer inside another CanvasLayer to order HUD zones, or ordering HUD zones by scene-tree position instead of CanvasLayer.layer"
    adr: ADR-0010
    status: accepted
    source: engine specialist review 2026-08-16 (blocking finding, fixed before the ADR-0010 write)
    reason: >
      Nested CanvasLayer has open, unresolved engine issues where the declared
      layer order is not honoured (godotengine/godot#25384, #22687). hud.md's
      "the debug overlay must not obscure any player-facing element" rule is
      load-bearing and must not rest on that undefined behaviour, or on tree
      order that anyone can silently change by dragging a node in the editor.
    remediation: "Four sibling CanvasLayer zones under a plain Node root, ordered by an explicit layer integer 1-4. See hud_zones_via_sibling_canvaslayers."

  - pattern: hud_writes_game_state
    description: "Any HUD script (or any node under hud.tscn) calling a mutator on OxygenState, LevelState, Plant, or PlayerWateringComponent"
    adr: ADR-0010
    status: accepted
    reason: >
      hud.md H19 requires the HUD be strictly read-only against these four
      types. No read-only facade wraps them (OxygenState already has no setter
      of any kind; LevelState's two mutators already name their only legal
      callers in other Accepted ADRs), so this is enforced by test rather than
      by structure — recorded honestly as a weaker guarantee in ADR-0010
      Consequences → Negative.
    remediation: "V9 greps every HUD script for a mutator call on the four named types and asserts zero matches."

  - pattern: watering_component_subscribes_gravity_changed
    description: "PlayerWateringComponent, Plant, or Bucket connecting to GravityAuthority.gravity_changed for any reason"
    adr: ADR-0009
    status: proposed
    reason: >
      watering-system.md §5 states the pour is unaffected by a gravity flip
      and the lock holds through the transition. Interact-area and
      pickup-area overlap are pure Area2D layer/mask detection, which does
      not consult gravity direction — a flip does not move the player's
      CollisionShape2D, so it cannot spuriously enter or exit an area. A
      future author subscribing "to be safe" during a flip would be adding
      the first coupling between watering and gravity broadcast for a
      problem that does not exist, and risks interrupting a pour the GDD
      explicitly requires to survive the transition (AC9).
    remediation: "No watering-system code subscribes to gravity_changed. If a genuine interaction between gravity and watering is ever designed, it needs its own ADR stating what problem it solves."
