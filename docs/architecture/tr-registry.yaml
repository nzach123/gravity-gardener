open_items:
  - id: TR-oxygen-006
    issue: >
      RESOLVED 2026-08-16. Owner decided (session 18): ADR-0008, via
      SceneTree.paused. ADR-0008 is now written and Accepted (2026-08-16) —
      status: covered above. No pause menu exists in src/ yet to exercise
      this against (ADR-0010, not yet written).
    severity: resolved

  - id: TR-gravity-012
    issue: >
      Depends on ADR-0001 Verification Required #2, still open — that a
      default-space gravity write in _physics_process reaches every RigidBody2D
      in the same step. gravity.md AC12 rests on it.
    severity: verification_open

  - id: TR-oxygen-003
    issue: >
      GDD revision flag. suit-oxygen.md says oxygen death is "immediate";
      ADR-0005 D5.2 defers it one physics frame by design.
    severity: gdd_conflict

  - id: TR-gravity-010
    issue: >
      Partially closed 2026-08-18. ADR-0013 now OWNS the decouple, which closes
      accessibility-requirements.md A7 ("no owning ADR"). D13.2/D13.4 close the
      input-basis leg permanently. D13.5 specifies the camera_moving split into
      camera_follow_enabled and camera_rotates_with_gravity but does not apply it —
      applying it changes live camera behaviour in level_01 and level_07 and needs a
      human playtest first. T8 is not runnable until then.
    severity: blocks_accessibility_commitment

  - id: TR-watering-001
    issue: >
      /architecture-review 2026-08-15-c, Finding 1: RESOLVED 2026-08-16.
      ADR-0009's Bucket.on_picked_up() set monitoring = false synchronously
      from inside _on_body_entered, which fires during
      PhysicsServer2D::flush_queries(); Godot raises a runtime error on
      Area2D monitoring mutation mid-flush. Fixed in the ADR text before
      Acceptance: on_picked_up() now uses set_deferred("monitoring", false),
      confirmed correct by a second godot-specialist validation pass at
      Acceptance (2026-08-16). ADR-0009 Accepted 2026-08-16.
    severity: resolved

  - id: TR-hazards-011
    issue: >
      V-HAZARD-MASK is OWED, not present. ADR-0003's v1 rule set has seven rules
      and this is not one of them. Do not assume LevelValidation catches a
      hazard whose mask excludes the player layer — today nothing does, and
      BUG-0001 is that failure shipped in levels 05 and 06.

      Route, decided 2026-08-24 (ARCH-1): the rule lands when a hazards ADR is
      written, and THAT ADR amends ADR-0003 D3.3's table in the same changeset.
      This is ADR-0003's own documented mechanism and it has been exercised
      once already — V-BOUNDS was added this way by ADR-0011 D11.7 on
      2026-08-24. ADR-0003's Risks table states the general rule: "Every future
      GDD introducing a level-authoring invariant must add a rule here."

      hazards.md §6 already names both checks and assigns them: "proposed here,
      owned there." ADR-0003 is NOT being reopened now to pre-add rules for a
      GDD that has not passed /design-review.
    severity: adr_extension_owed

  - id: TR-hazards-012
    issue: >
      V-HAZARD-SPAWN is OWED. Same route as TR-hazards-011, with one extra
      condition: verify the engine behaviour before specifying the rule.

      The check needs a geometric overlap test between the spawn point and a
      hazard on a node that is instantiated but never added to a tree. Reading
      an Area2D extent under those conditions is UNVERIFIED against 4.7.1 and is
      already carried as an open risk for V-BOUNDS in
      production/epics/index.md. If the read does not work headlessly, this rule
      needs a different mechanism, not a different owner.
    severity: adr_extension_owed

  - id: TR-hazards-000
    issue: >
      SYSTEM-LEVEL, not entry-level. NO ADR COVERS HAZARDS — 10 of the 12
      hazards requirements are unowned, which is the largest single block of
      unowned requirements in this registry. architecture.md places SpikeHazard
      and KillArea in the Feature layer, production/epics/index.md files Hazards
      under "Not yet epic'd", and hazards.md has not passed /design-review.

      hazards.md §6 also records three defects in shipped code: R1 renames
      inc_hazard_dmg, R5 removes a horizontal-only constraint in
      spike_hazard.gd, and R9 is BUG-0001. Those are code changes waiting on an
      epic, not design questions.

      Sequence, so this is not read as a call to write the ADR immediately:
      /design-review on hazards.md first, then the ADR, then the epic. The
      rule numbering these 12 IDs anchor to is not yet stable.
    severity: system_unowned

  - id: TR-flow-010
    issue: >
      Design decision owed, and the GDD says so itself with a ⚠ TBD. What
      follows the FINAL level in the authored sequence is undecided.
      production/epics/index.md carries this as BLOCKED for the level-outcomes
      epic. It is a design question for the owner, not an architecture gap.
    severity: design_decision_owed

  - id: TR-flow-004
    issue: >
      complete_hold_duration is ⚠ unset. level-flow.md §7 proposes 0.6 s in a
      0.2-1.5 s range and ADR-0014 deliberately leaves it unset. Needs a HUMAN
      playtest, not an agent one — agent-driven playtests have already been
      found unreliable for pacing judgements on this project. The mechanism is
      owned by ADR-0014; only the value is open.
    severity: playtest_owed
