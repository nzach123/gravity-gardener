# Technical Requirements Registry — Gravity Gardener
#
# The 52-requirement TR baseline. `architecture.md:9` and `systems-index.md:58`
# have described this baseline as extracted and mapped since 2026-08-13, but no
# file defined a single TR ID until this one. Every prior occurrence across
# `architecture.md` and the six ADRs was a citation of a table that was never
# written.
#
# READ THIS BEFORE CITING ANY ID
# ------------------------------
# This registry was RECONSTRUCTED, not recovered. The distinction matters and is
# recorded per entry in the `provenance` field:
#
#   provenance: verbatim
#     The ID appears in surviving prose that states what it covers. 7 of 52.
#     `confirmed_by` names the exact source. These are facts.
#
#   provenance: derived
#     The ID's existence and its owning ADR are reliable; which numbered slot a
#     given GDD rule occupies is an assignment made by
#     `architecture-review-2026-08-15.md`, not recovered fact. 45 of 52.
#     Treat the slot number as this project's convention, not as history.
#
# Why the allocation is trustworthy even where the text is not: the surviving
# citations fill four contiguous ranges with no gaps and no overlaps
# (13 / 18 / 12 / 9 = 52), matching the documented total exactly. A bad
# reconstruction does not produce that shape. Each ADR's cited IDs were then
# fitted only to requirements that ADR actually addresses, which is a hard
# constraint.
#
# CORRECTIONS
# -----------
# An entry whose text was stale at the time of writing is corrected in place and
# carries a `corrected:` key naming the date and the reason. This follows the
# convention settled 2026-08-15 in `docs/registry/architecture.yaml`: correcting
# text that never matched its source is not a supersession, because supersession
# would falsely imply the requirement once said the wrong thing.
#
# Two entries were corrected on creation — TR-watering-017 and TR-watering-018.
# Both were stale in the source review. They were fixed BEFORE this file gained
# binding force rather than written wrong and amended later.
#
# SCOPE
# -----
# GDD-derived requirements only. UX commitments that do not originate in a GDD
# (for example the on-demand tally in `design/accessibility-requirements.md`) are
# NOT TRs and must not be given IDs here.
#
# Created: 2026-08-15
# Source: docs/architecture/architecture-review-2026-08-15.md § Traceability Matrix
#
# 2026-08-24 SWEEP — hazards.md and level-flow.md (sprint task ARCH-1)
# ------------------------------------------------------------------
# Both GDDs were authored 2026-08-17, after this registry's 52-TR baseline was
# frozen, so neither had a single TR ID. `production/epics/index.md` recorded
# the result twice as a live traceability gap. This sweep closes it: 12 hazards
# IDs and 10 level-flow IDs, taking the baseline from 52 to 74.
#
# These IDs carry a THIRD provenance value:
#
#   provenance: allocated
#     The ID was created by this sweep. It is not recovered from a surviving
#     citation and it is not fitted to one. The GDD rule it names is the fact;
#     the ID and its slot number are new. 22 of 74.
#
# `derived` would have been the wrong label. That value means the ID's
# existence and its owning ADR are reliable from surviving prose, and only the
# slot number is an assignment. Nothing cited these requirements at all.
#
# Two facts a later reader needs before trusting the hazards block:
#
#   1. NO ADR OWNS HAZARDS. 10 of the 12 hazards entries are gap / unowned.
#      That is not a defect in this sweep — it is the architecture gap the
#      sweep makes countable. `architecture.md` places SpikeHazard / KillArea
#      in the Feature layer and `production/epics/index.md` files Hazards under
#      "Not yet epic'd".
#   2. `hazards.md` HAS NOT PASSED /design-review. Its rule numbering may still
#      move. Every hazards entry carries a note saying so. Correct in place if
#      it moves — do not supersede.

version: 2
last_updated: 2026-08-24 (ARCH-1 sweep)

baseline:
  total: 74
  by_system:
    gravity: 13
    watering: 18
    oxygen: 12
    props: 9
    hazards: 12
    flow: 10
  note: >
    52 through 2026-08-16. The 2026-08-24 ARCH-1 sweep added hazards (12) and
    flow (10). 13 + 18 + 12 + 9 + 12 + 10 = 74.

coverage:
  covered_by_accepted_adr: 59
  gap_assigned_to_unwritten_adr: 0
  gap_unowned: 13
  parked_or_implemented: 2
  note: >
    All six Foundation ADRs became Accepted on 2026-08-15 (session 12). The
    source review recorded coverage-by-accepted as 0 of 52 because every ADR was
    still Proposed when it ran. ADR-0007 (Player component contract and physics
    step order) became Accepted later the same day (session 17), closing
    TR-gravity-004/005/006/007/013 and TR-watering-014 — six requirements moving
    gap → covered. TR-watering-002 was reassigned from ADR-0007 to ADR-0009 in
    the same pass (see its entry's `corrected` note). 28 was current through
    2026-08-15.

    2026-08-16 (session 19): ADR-0008 and ADR-0009 both became Accepted, each
    after a second godot-specialist validation pass with no blocking issues.
    ADR-0008 closes TR-oxygen-001/002/003/004/006 (5). ADR-0009 closes
    TR-watering-001/003/004/005/009/010/016 (7) — 12 requirements moving gap →
    covered, taking covered_by_accepted_adr from 28 to 40.

    TR-watering-002 is the one exception: ADR-0009 is Accepted but its own GDD
    Requirements Addressed table and Consequences state plainly that it does
    NOT cover this requirement. `adr: ADR-0009` / `adr_status: not_written`
    would misstate both facts (the ADR exists and is Accepted, yet doesn't own
    the requirement), so its entry was corrected to `adr: null` /
    `adr_status: unowned` and it moved into its own gap_unowned bucket, out of
    gap_assigned_to_unwritten_adr (22 → 9, after also subtracting the 12 newly
    covered). 40 + 9 + 1 + 2 = 52, verified against a full count of this
    file's per-entry `status:` values, 2026-08-16.

    2026-08-16 (session 23): ADR-0010, ADR-0011 and ADR-0012 all became
    Accepted in one pass, closing every requirement left in
    gap_assigned_to_unwritten_adr — that bucket held exactly 9, and these three
    ADRs' GDD Requirements Addressed tables account for exactly 9 between them.
    ADR-0012 closes TR-watering-007 (1). ADR-0011 closes
    TR-props-003/005/006/008 (4). ADR-0010 closes TR-oxygen-007/009 and
    TR-watering-017/018 (4). covered_by_accepted_adr moves 40 → 49,
    gap_assigned_to_unwritten_adr moves 9 → 0. 49 + 0 + 1 + 2 = 52. All 12
    planned ADRs are now Accepted; the only remaining non-covered requirement
    is TR-watering-002, deliberately unowned (see its entry).

    2026-08-24 (ARCH-1 sweep): hazards and flow enter the baseline. 10 of the
    22 new IDs are covered by an already-Accepted ADR — ADR-0005 owns the
    level-flow latch, chokepoint and shared death path (7), ADR-0014 owns the
    completion hold (1), ADR-0002 owns the total reset (1), and ADR-0004 owns
    the hazard mask predicate (1). covered_by_accepted_adr moves 49 → 59.
    The other 12 are unowned: 10 hazards entries with no ADR of any kind, plus
    TR-flow-005 (a HUD element that does not exist) and TR-flow-010 (a design
    decision the GDD marks TBD). gap_unowned moves 1 → 13.
    59 + 0 + 13 + 2 = 74.

    Read the jump in gap_unowned as measurement, not regression. These
    requirements were already unowned on 2026-08-17. Until this sweep they were
    merely uncounted.

