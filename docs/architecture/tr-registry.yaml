          owns OxygenDrain and therefore owns this requirement. ADR-0010 (pause
          menu / HUD) owns TOGGLING get_tree().paused — a dependency, not a
          split ownership claim.

          CORRECTED 2026-08-16 (session 22/23): the line above previously read
          "exempting its own Controls with PROCESS_MODE_WHEN_PAUSED". The
          godot-specialist gate on ADR-0010 confirmed WHEN_PAUSED runs ONLY
          while the tree is paused — the exact inverse of PAUSABLE. Applied as
          written, every player-facing HUD Control would go dark during normal
          play. ADR-0010 D10.6 states the correct policy instead: player-facing
          HUD Controls take NO exemption at all (freezing on pause is what
          hud.md requires of them); only the debug overlay E7 and
          PauseController itself get PROCESS_MODE_ALWAYS. Corrected in place
          per this registry's own convention — the stance never changed, this
          note misstated it.
      note: >
        Mechanism: SceneTree.paused, not an injected pause-state object.
        suit-oxygen.md §5 states it plainly: "when one is added, halting the
        drain is a requirement, not a nicety." No pause menu exists in src/ yet.
        hud.md U10.3's frozen-HUD state should fall out of the same mechanism —
        HUD's own Controls default to PROCESS_MODE_INHERIT too — unless ADR-0010
        needs something (e.g. a pause-menu transition) to keep animating while
        paused, in which case that exemption must be stated explicitly there.
      note_2: >
        /architecture-review 2026-08-15-c, Finding 3: RESOLVED 2026-08-16.
        godot-specialist consult confirmed PROCESS_MODE_INHERIT resolving to
        PROCESS_MODE_PAUSABLE (and halting _physics_process under
        SceneTree.paused) is correct Godot 4.x behaviour. A "Pause and process
        modes" section was added to modules/core.md and ADR-0008's Verification
        Required field now cites it. Re-confirmed by a second godot-specialist
        validation pass at Acceptance (2026-08-16), no blocking issues found.

